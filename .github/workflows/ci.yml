name: Verify Living Canvas
on:
  pull_request:
  push:
    branches: [main, feat/living-canvas-v1]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
